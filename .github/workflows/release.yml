# ADR-14: todo commit na main gera tag vX.Y.Z e GitHub Release. Sem filtro de caminho.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: MegaMixDistribuidora/shd-github-actions-workflows/.github/workflows/release-semantic.yml@v1.1.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
